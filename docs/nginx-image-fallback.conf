# Add this to your nginx configuration for automatic image fallbacks
# This eliminates 404s by serving a placeholder when images don't exist

location /data/images/ {
    alias /var/www/search.brck.ca/public/data/images/;
    expires 30d;
    access_log off;

    # Try the requested file, if not found, serve placeholder
    try_files $uri /data/images/placeholder.webp;

    # Add CORS headers if needed
    add_header 'Access-Control-Allow-Origin' '*';
    add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS';
    add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range';
}

# You would need to create a placeholder.webp file in your images directory
# This approach eliminates all 404s and API calls, but you lose the ability
# to show different UI states (loading, error, etc.)